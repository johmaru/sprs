[package]
name = "sprs"
version = "0.1.0"
edition = "2024"

[dependencies]
half = "2.7.1"
inkwell = { version = "0.9.0", default-features = false, features = ["llvm22-1", "target-x86"] }
lalrpop-util = { version = "0.23.1", features = ["lexer"] }
logos = "0.16.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.3"
[build-dependencies]
lalrpop = "0.23.1"
